้<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>รายละเอียดงาน - ต้มไข่ไผ่</title>
<style>
  body {
    font-family: sans-serif;
    background: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    width: 360px;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
  }
  .card .content {
    padding: 16px;
  }
  .card .title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .card .detail {
    font-size: 14px;
    color: #444;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="https://picsum.photos/seed/job1/400/200" alt="ภาพงานต้มไข่ไผ่">
    <div class="content">
      <div class="title">ต้มไข่ไผ่</div>
      <div class="detail">
        งานนี้เกี่ยวข้องกับการพัฒนาและทดลองโมเดล Machine Learning  
        เน้นการจัดการข้อมูล การฝึกสอนโมเดล และการนำเสนอผลลัพธ์ในรูปแบบที่เข้าใจง่าย  
        ผู้รับงานต้องมีทักษะด้าน ML และ Data Processing
      </div>
    </div>
  </div>
</body>
</html>
